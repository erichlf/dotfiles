name: "test-install-main"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  GREEN: '\033[0;32m'
  NC: '\033[0m'
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup ssh
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install
        run: |
          set +e
          ./install.sh > /tmp/install.log 2>&1
          rc=$?
          cat /tmp/install.log
          if [ $rc -ne 0 ]; then
            echo "::error::Install failed (exit $rc); error lines follow"
            {
              grep -iE '^(E:|W:|dpkg:|error|fatal|failed)|error:|failed|no space|cannot|abort|not found' /tmp/install.log | tail -n 3
              echo "--- last lines ---"
              tail -n 5 /tmp/install.log
            } | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $rc
