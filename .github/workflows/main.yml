name: "test-install-main"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  GREEN: '\033[0;32m'
  NC: '\033[0m'
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup ssh
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install
        run: |
          set +e
          ./install.sh > /tmp/install.log 2>&1
          rc=$?
          cat /tmp/install.log
          if [ $rc -ne 0 ]; then
            tail -n 30 /tmp/install.log | sed ':a;N;$!ba;s/\n/%0A/g' |
              sed "s/^/::error::Install failed (exit $rc): /"
          fi
          exit $rc
